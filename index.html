<!doctype html>
<html lang="et">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Peida nägu</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --fg: #f2f2f2;
    --accent: #4fd1c5;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  video {
    display: none;
  }
  canvas#view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    text-align: center;
    padding: 2rem;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), rgba(0,0,0,0.85));
  }
  #overlay h1 {
    font-size: clamp(1.25rem, 4vw, 2rem);
    margin: 0;
    font-weight: 600;
  }
  #overlay p {
    max-width: 32rem;
    line-height: 1.5;
    color: #c9c9c9;
    margin: 0;
  }
  button#start {
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 0.9rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    background: var(--accent);
    color: #003532;
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  button#start:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79, 209, 197, 0.35); }
  button#start:active { transform: translateY(0); }
  #status {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    padding-top: 0.75rem;
    pointer-events: none;
  }
  #status span {
    font-size: 0.8rem;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    color: #ddd;
    letter-spacing: 0.02em;
  }
  #error {
    color: var(--danger);
    font-size: 0.9rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
  </div>

  <div id="status" hidden>
    <span id="status-text">Laen nägude tuvastust…</span>
  </div>

  <div id="overlay">
    <h1>Kaamera nägude pikseldamine</h1>
    <p>Rakendus näitab su veebikaamera pilti täisekraanil ja pikseldab automaatselt tuvastatud näod. Vajutamisel küsitakse kaamera kasutamise luba.</p>
    <button id="start">Käivita kaamera</button>
    <p id="error" hidden></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js"></script>
  <script>
  (function () {
    "use strict";

    const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model";

    const video = document.getElementById("cam");
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start");
    const errorEl = document.getElementById("error");
    const statusWrap = document.getElementById("status");
    const statusText = document.getElementById("status-text");

    let running = false;
    let lastDetections = [];
    let detectBusy = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function setStatus(msg) {
      statusText.textContent = msg;
      statusWrap.hidden = false;
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
    }

    async function loadModels() {
      setStatus("Laen nägude tuvastuse mudelit…");
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    }

    async function startCamera() {
      startBtn.disabled = true;
      errorEl.hidden = true;
      try {
        await loadModels();
      } catch (err) {
        showError("Mudeli laadimine ebaõnnestus: " + err.message);
        startBtn.disabled = false;
        return;
      }

      setStatus("Küsin kaamera luba…");
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
      } catch (err) {
        showError("Kaamerale ligipääs ebaõnnestus: " + err.message);
        startBtn.disabled = false;
        statusWrap.hidden = true;
        return;
      }

      video.srcObject = stream;
      await video.play();

      overlay.hidden = true;
      setStatus("Tuvastan nägusid…");
      running = true;

      renderLoop();
      detectLoop();
    }

    // Mirror + cover-fit draw of the raw camera frame onto the canvas.
    function drawFrame() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const cw = canvas.width;
      const ch = canvas.height;
      const videoRatio = vw / vh;
      const canvasRatio = cw / ch;

      let drawW, drawH, offsetX, offsetY;
      if (canvasRatio > videoRatio) {
        drawW = cw;
        drawH = cw / videoRatio;
        offsetX = 0;
        offsetY = (ch - drawH) / 2;
      } else {
        drawH = ch;
        drawW = ch * videoRatio;
        offsetX = (cw - drawW) / 2;
        offsetY = 0;
      }

      ctx.save();
      ctx.translate(cw, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
      ctx.restore();

      // Mirror offsetX so pixelation boxes line up with the flipped image.
      const mirroredOffsetX = cw - offsetX - drawW;
      return { offsetX: mirroredOffsetX, offsetY, drawW, drawH, vw, vh };
    }

    function pixelateRegion(x, y, w, h, blockSize) {
      x = Math.max(0, Math.floor(x));
      y = Math.max(0, Math.floor(y));
      w = Math.min(Math.floor(w), canvas.width - x);
      h = Math.min(Math.floor(h), canvas.height - y);
      if (w <= 0 || h <= 0) return;

      const scale = Math.max(1 / blockSize, 0.02);
      const smallW = Math.max(1, Math.round(w * scale));
      const smallH = Math.max(1, Math.round(h * scale));

      const off = document.createElement("canvas");
      off.width = smallW;
      off.height = smallH;
      const offCtx = off.getContext("2d");
      offCtx.drawImage(canvas, x, y, w, h, 0, 0, smallW, smallH);

      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, smallW, smallH, x, y, w, h);
      ctx.restore();
    }

    function renderLoop() {
      if (!running) return;
      const frame = drawFrame();

      if (frame) {
        const { offsetX, offsetY, drawW, drawH, vw, vh } = frame;
        const scaleX = drawW / vw;
        const scaleY = drawH / vh;

        for (const det of lastDetections) {
          const box = det.box;
          // Detection ran on the mirrored canvas image itself, so no extra flip needed here.
          const pad = 0.35;
          const bw = box.width * (1 + pad * 2);
          const bh = box.height * (1 + pad * 2);
          const bx = box.x - box.width * pad;
          const by = box.y - box.height * pad * 1.3;

          pixelateRegion(bx, by, bw, bh, 14);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    async function detectLoop() {
      if (!running) return;
      if (!detectBusy && video.videoWidth) {
        detectBusy = true;
        try {
          const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 });
          const results = await faceapi.detectAllFaces(canvas, options);
          lastDetections = results;
          statusWrap.hidden = results.length > 0 ? true : false;
          if (results.length === 0) setStatus("Nägu ei tuvastatud…");
        } catch (err) {
          // Detection frame skipped; keep previous boxes.
        }
        detectBusy = false;
      }
      setTimeout(detectLoop, 120);
    }

    startBtn.addEventListener("click", startCamera);
  })();
  </script>
</body>
</html>
